#        "pydantic>=2.0.0"
#
[project]
name = "connectlife"
version = "1.0.0"
description = "ConnectLife Home Assistant custom integration"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.11.11",
    "cryptography>=42.0.0",
    "pydantic>=2.0.0",
    "tenacity>=8.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-homeassistant-custom-component",
    "pyright>=1.1.411",
    "ruff>=0.16.3",
    "typer>=0.27.1",
    "rich>=15.0.0",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF"]
ignore = ["E501"]  # line length — not enforced

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
