#        "pydantic>=2.0.0"
#
[project]
name = "connectlife-ha-integration"
version = "1.0.0"
description = "ConnectLife Home Assistant custom integration"
requires-python = ">=3.13.2,<3.14"
dependencies = [
    "aiohttp>=3.11.11",
    "connectlife>=0.10.0",
    "pydantic>=2.12.2",
    "tenacity>=8.2.0",
]

[dependency-groups]
dev = [
    # Tightly coupled to a specific homeassistant release; pin exactly rather
    # than letting the resolver pick (it can otherwise land on either an
    # ancient 0.x release or one that requires a not-yet-installed Python).
    "pytest-homeassistant-custom-component==0.13.315",
    "pyright>=1.1.350",
    "ruff>=0.9.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF"]
ignore = ["E501"]  # line length — not enforced

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
