<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Background rounded square -->
  <rect width="256" height="256" rx="48" ry="48" fill="#00AEEF"/>

  <!-- AC unit body -->
  <rect x="36" y="92" width="184" height="90" rx="14" ry="14" fill="#FFFFFF"/>

  <!-- Vent slats -->
  <rect x="52" y="112" width="152" height="6" rx="3" fill="#00AEEF"/>
  <rect x="52" y="127" width="152" height="6" rx="3" fill="#00AEEF"/>
  <rect x="52" y="142" width="152" height="6" rx="3" fill="#00AEEF"/>
  <rect x="52" y="157" width="80"  height="6" rx="3" fill="#00AEEF"/>

  <!-- Power button circle -->
