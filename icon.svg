    <line x1="6"  y1="-22" x2="0" y2="-18"/>
    <line x1="-6" y1="22"  x2="0" y2="18"/>
    <line x1="6"  y1="22"  x2="0" y2="18"/>
    <line x1="-19.6" y1="-6" x2="-15.6" y2="-9"/>
    <line x1="-19.6" y1="-12" x2="-15.6" y2="-9"/>
    <line x1="19.6"  y1="-6" x2="15.6"  y2="-9"/>
    <line x1="19.6"  y1="-12" x2="15.6" y2="-9"/>
    <line x1="-19.6" y1="6"  x2="-15.6" y2="9"/>
    <line x1="-19.6" y1="12" x2="-15.6" y2="9"/>
    <line x1="19.6"  y1="6"  x2="15.6"  y2="9"/>
    <line x1="19.6"  y1="12" x2="15.6"  y2="9"/>
